<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="prodTitle">
  <title id="prodTitle">Ilustrasi AI untuk Produktivitas</title>
  <defs>
    <linearGradient id="prodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fa8d8"/>
      <stop offset="100%" stop-color="#136088"/>
    </linearGradient>
    <linearGradient id="prodGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#prodBg)"/>
  <circle cx="660" cy="100" r="190" fill="url(#prodGlow)"/>
  <circle cx="100" cy="420" r="150" fill="url(#prodGlow)"/>

  <!-- checklist card -->
  <g transform="translate(280 130)">
    <rect width="240" height="240" rx="24" fill="#ffffff" opacity="0.95"/>
    <g stroke="#136088" stroke-width="10" stroke-linecap="round">
      <line x1="40" y1="55" x2="200" y2="55"/>
      <line x1="40" y1="105" x2="200" y2="105"/>
      <line x1="40" y1="155" x2="150" y2="155"/>
    </g>
    <g fill="#2fa8d8">
      <circle cx="24" cy="55" r="9"/>
      <circle cx="24" cy="105" r="9"/>
      <circle cx="24" cy="155" r="9"/>
    </g>
  </g>

  <!-- lightning bolt accent -->
  <g transform="translate(560 300)">
    <circle r="70" fill="#ffffff" opacity="0.15"/>
    <path d="M10 -55 L-38 10 L-6 10 L-12 55 L40 -12 L6 -12 Z" fill="#ffffff"/>
  </g>

  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" opacity="0.7">DelAI Insights</text>
</svg>
