<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="genaiTitle">
  <title id="genaiTitle">Ilustrasi Generative AI</title>
  <defs>
    <linearGradient id="genaiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a5cf0"/>
      <stop offset="100%" stop-color="#3c2fb0"/>
    </linearGradient>
    <linearGradient id="genaiGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#genaiBg)"/>

  <circle cx="640" cy="90" r="180" fill="url(#genaiGlow)"/>
  <circle cx="120" cy="430" r="140" fill="url(#genaiGlow)"/>

  <!-- decorative dot grid -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="60" cy="60" r="4"/>
    <circle cx="90" cy="60" r="4"/>
    <circle cx="120" cy="60" r="4"/>
    <circle cx="60" cy="90" r="4"/>
    <circle cx="90" cy="90" r="4"/>
    <circle cx="120" cy="90" r="4"/>
  </g>

  <!-- central sparkle / generative burst icon -->
  <g transform="translate(400 250)">
    <circle r="118" fill="#ffffff" opacity="0.10"/>
    <circle r="86" fill="#ffffff" opacity="0.12"/>

    <g fill="#ffffff">
      <path d="M0 -70 C 10 -22, 22 -10, 70 0 C 22 10, 10 22, 0 70 C -10 22, -22 10, -70 0 C -22 -10, -10 -22, 0 -70 Z"/>
      <path d="M92 -58 C 96 -46, 104 -38, 116 -34 C 104 -30, 96 -22, 92 -10 C 88 -22, 80 -30, 68 -34 C 80 -38, 88 -46, 92 -58 Z" opacity="0.85"/>
      <path d="M-100 40 C -97 49, -91 55, -82 58 C -91 61, -97 67, -100 76 C -103 67, -109 61, -118 58 C -109 55, -103 49, -100 40 Z" opacity="0.7"/>
    </g>
  </g>

  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" opacity="0.65">DelAI Insights</text>
</svg>
