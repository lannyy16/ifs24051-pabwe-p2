<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="mlTitle">
  <title id="mlTitle">Ilustrasi Machine Learning</title>
  <defs>
    <linearGradient id="mlBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2fb380"/>
      <stop offset="100%" stop-color="#136b4d"/>
    </linearGradient>
    <linearGradient id="mlGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mlBg)"/>
  <circle cx="680" cy="80" r="190" fill="url(#mlGlow)"/>
  <circle cx="80" cy="440" r="150" fill="url(#mlGlow)"/>

  <!-- network graph nodes -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.55">
    <line x1="230" y1="180" x2="400" y2="140"/>
    <line x1="230" y1="180" x2="380" y2="260"/>
    <line x1="230" y1="180" x2="220" y2="330"/>
    <line x1="400" y1="140" x2="560" y2="190"/>
    <line x1="400" y1="140" x2="380" y2="260"/>
    <line x1="380" y1="260" x2="560" y2="190"/>
    <line x1="380" y1="260" x2="220" y2="330"/>
    <line x1="380" y1="260" x2="540" y2="340"/>
    <line x1="560" y1="190" x2="540" y2="340"/>
    <line x1="220" y1="330" x2="400" y2="380"/>
    <line x1="540" y1="340" x2="400" y2="380"/>
  </g>

  <g fill="#ffffff">
    <circle cx="230" cy="180" r="12"/>
    <circle cx="400" cy="140" r="16"/>
    <circle cx="380" cy="260" r="20"/>
    <circle cx="560" cy="190" r="13"/>
    <circle cx="220" cy="330" r="14"/>
    <circle cx="540" cy="340" r="12"/>
    <circle cx="400" cy="380" r="15"/>
  </g>

  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" opacity="0.65">DelAI Insights</text>
</svg>
