<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="ethicsTitle">
  <title id="ethicsTitle">Ilustrasi Etika Artificial Intelligence</title>
  <defs>
    <linearGradient id="ethicsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0a52e"/>
      <stop offset="100%" stop-color="#a5680f"/>
    </linearGradient>
    <linearGradient id="ethicsGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ethicsBg)"/>
  <circle cx="120" cy="90" r="180" fill="url(#ethicsGlow)"/>
  <circle cx="680" cy="420" r="150" fill="url(#ethicsGlow)"/>

  <!-- shield with check -->
  <g transform="translate(400 250)">
    <circle r="130" fill="#ffffff" opacity="0.10"/>
    <path d="M0 -110 L90 -75 C90 -10 55 55 0 110 C-55 55 -90 -10 -90 -75 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M-40 0 L-10 32 L48 -38" fill="none" stroke="#a5680f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" opacity="0.7">DelAI Insights</text>
</svg>
